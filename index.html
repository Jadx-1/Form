<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuesioner Aplikasi Pemilihan Ketos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Mengatur background menggunakan gambar yang diminta */
            background-image: url('background_pertanyaan.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Latar belakang gelap transparan di belakang card (opsional, untuk fokus) */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* Desain Card Pop-Up Transparan */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.5); /* Transparan */
            backdrop-filter: blur(8px); /* Efek blur kaca */
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: #000000; /* Teks Hitam */
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #333333;
        }

        /* Pengaturan respon email berhasil */
        input[type="hidden"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <h2>Pertanyaan Aplikasi Pemilihan Ketos</h2>
        
        <!-- Form action mengarah ke formsubmit.co dengan email tujuan Anda -->
        <form action="https://formsubmit.co/prajadisa2025@gmail.com" method="POST">
            
            <!-- Konfigurasi FormSubmit (Opsional) -->
            <input type="hidden" name="_subject" value="Jawaban Baru: Kuesioner Aplikasi Ketos">
            <input type="hidden" name="_captcha" value="false">

            <div class="form-group">
                <label>1. Berapa kandidat, dan apakah ada pemilihan lebih dari satu jabatan (misalnya ketua dan wakil terpisah) atau satu paket pasangan saja?</label>
                <textarea name="1_Kandidat_Jabatan" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>2. Apakah ada opsi golput / kotak kosong?</label>
                <textarea name="2_Opsi_Golput" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>3. Siapa yang boleh memilih: semua siswa, atau hanya kelas tertentu? Apakah guru/staf juga ikut?</label>
                <textarea name="3_Siapa_Pemilih" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>4. Apakah ada jadwal buka dan tutup pemilihan, dan apakah harus otomatis? atau di atur admin?</label>
                <textarea name="4_Jadwal_Pemilihan" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>5. Dari mana data siswa didapat, dan siapa yang memberikannya pada saya? Dalam format apa (Excel, Dapodik) nantinya untuk login para siswa?</label>
                <textarea name="5_Data_Siswa" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>6. Login nya mau NISN aja atau dengan password? (Catatan: kalau sudah memiliki NISN beserta PIN/password dari sekolah boleh dipakai, karena kalau NISN saja teman yang tau bisa memakai akunnya)</label>
                <textarea name="6_Metode_Login" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>7. Bagaimana kalau ada siswa yang NISN-nya belum ada? Kalau iya harus di data dan pakai NISN sementara yang saya buat.</label>
                <textarea name="7_Siswa_Tanpa_NISN" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>8. Apakah wali kelas bersedia membagikan info akun (NISN & password) ke siswa satu persatu? (Disarankan pakai metode Generate PIN agar siswa memasukkan NISN & tgl lahir untuk memunculkan PIN otomatis guna menghindari kecurangan).</label>
                <textarea name="8_Distribusi_Akun" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>9. Aplikasinya sekali pakai atau akan dipakai lagi (Reusable)? (Supaya saya bisa me-maintenance dan menyesuaikan biaya hosting/posting website ke publik).</label>
                <textarea name="9_Sekali_Pakai_atau_Reusable" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>10. Websitenya mau diakses dari HP dan laptop/komputer? atau salah satu saja?</label>
                <textarea name="10_Akses_Perangkat" required placeholder="Tulis jawaban Anda di sini..."></textarea>
            </div>

            <div class="form-group">
                <label>11. Alur sederhana: Siswa masuk (NISN+PIN) -> Pilih 1 kandidat -> Data masuk live ke admin -> Tampil TV Aula saat pengumuman. Apakah setuju dengan alur ini atau ada fitur tambahan?</label>
                <textarea name="11_Persetujuan_Alur_dan_Fitur_Tambahan" required placeholder="Tulis jawaban atau fitur tambahan di sini..."></textarea>
            </div>

            <button type="submit">Kirim Jawaban</button>
        </form>
    </div>

</body>
</html>
